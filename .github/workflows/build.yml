name: Build

on:
  push:
    branches: [ main, dev, 'test/installer-*' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -v ./cmd/sess

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -tags=integration ./...

      - name: Test installer
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/install.sh
          python3 scripts/test_install.py

      - name: Test Windows installer (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install.ps1 -BinaryPath ./sess.exe

      - name: Test Windows installer (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install.ps1 -BinaryPath ./sess.exe

      - name: Test Windows installer as a standard user
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install_standard_user.ps1 -BinaryPath ./sess.exe

      - name: Run race checks
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -tags=integration ./...

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sess-${{ github.sha }}
          path: sess
          retention-days: 7
