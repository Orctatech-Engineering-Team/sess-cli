name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v0.2.0, v1.0.0, etc.

permissions:
  contents: write

jobs:
  windows-installer:
    name: Validate Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build Windows binary
        run: go build -o sess.exe ./cmd/sess
      - name: Test PowerShell 7 installer
        shell: pwsh
        run: ./scripts/test_install.ps1 -BinaryPath ./sess.exe
      - name: Test Windows PowerShell 5.1 installer
        shell: powershell
        run: ./scripts/test_install.ps1 -BinaryPath ./sess.exe

      - name: Test standard-user installation
        shell: powershell
        run: ./scripts/test_install_standard_user.ps1 -BinaryPath ./sess.exe

  release:
    name: Build and Release
    needs: windows-installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Read release changelog
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import uuid

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(
              rf"^## {re.escape(version)}(?: - [^\n]+)?\n(.*?)(?=^## |\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group(1).strip():
              raise SystemExit(f"Missing changelog entry for {version}")
          delimiter = uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"body<<{delimiter}\n{section.group(1).strip()}\n{delimiter}\n")
          PY

      - name: Validate release
        run: |
          go vet ./...
          go test -race -tags=integration ./...
          bash -n scripts/install.sh
          python3 scripts/test_install.py

      - name: Build binaries
        run: |
          # Create dist directory
          mkdir -p dist

          # Define platforms
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            OUTPUT_NAME="sess"

            if [ "$GOOS" = "windows" ]; then
              OUTPUT_NAME="${OUTPUT_NAME}.exe"
            fi

            echo "Building for $GOOS/$GOARCH..."
            # versioninfo package automatically uses git tags and commits
            # -s -w strips debug info for smaller binaries
            GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w" \
              -o "dist/${OUTPUT_NAME}" \
              ./cmd/sess

            # Create tarball/zip
            cd dist
            if [ "$GOOS" = "windows" ]; then
              zip "sess-${GOOS}-${GOARCH}.zip" "${OUTPUT_NAME}"
              rm "${OUTPUT_NAME}"
            else
              tar czf "sess-${GOOS}-${GOARCH}.tar.gz" "${OUTPUT_NAME}"
              rm "${OUTPUT_NAME}"
            fi
            cd ..
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Prepare installer asset
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Validate installer against release artifacts
        run: |
          bash -n dist/install.sh

          INSTALL_DIR="$RUNNER_TEMP/sess-install/bin"
          mkdir -p "$INSTALL_DIR"

          SESS_BASE_URL="file://$PWD/dist" \
          SESS_INSTALL_DIR="$INSTALL_DIR" \
          bash dist/install.sh

          test -x "$INSTALL_DIR/sess"
          "$INSTALL_DIR/sess" --version

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/install.sh
            dist/install.ps1
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ${{ steps.release_notes.outputs.body }}

            ## Installation

            ### Quick Install
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/install.sh | bash
            ```

            New installs use `~/.local/bin/sess` without sudo. Follow the installer's PATH instructions if needed.
            Rerun this command to update an existing writable install on PATH. Session data stays untouched.

            To choose another directory:

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/install.sh | env SESS_INSTALL_DIR="$HOME/bin" bash
            ```

            Protected system installs require an explicit administrator update or a move to a user directory.
            See the README for update and migration instructions. Package-managed installs should use their package manager.

            ### Manual Install

            Linux/macOS archive contents extract to a binary named `sess`, not a platform-named file.

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/sess-linux-amd64.tar.gz | tar xz
            mkdir -p "$HOME/.local/bin"
            install -m 0755 sess "$HOME/.local/bin/sess"
            ```

            ### Windows (PowerShell)
            ```powershell
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/install.ps1" -OutFile install.ps1
            & .\install.ps1
            ```

            New installs use `%LOCALAPPDATA%\Programs\SESS` without administrator access.
            Follow the PATH instructions, or pass `-InstallDir` to choose another directory.
            Rerun to update an existing writable copy. Session data stays untouched.

            ## What's Changed

            See the full changelog below.

            ## Verify Installation

            ```bash
            sess --version
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
